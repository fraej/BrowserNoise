<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate white, pink, and brown noise in your browser, with an adjustable filter.">
    <title>BrowserNoise</title>
    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main-window">
        <div class="window-titlebar">
            <div class="window-controls" aria-hidden="true">
                <div class="control close"></div>
                <div class="control minimize"></div>
                <div class="control zoom"></div>
            </div>
            <h1 class="window-title">BrowserNoise</h1>
        </div>
        <div class="container">
            <!-- Noise Controls -->
            <section class="control-group">
                <h2>Noise Generator</h2>
                <div>
                    <span class="label" id="noiseTypeLabel">Noise Type</span>
                    <div id="noiseType" class="button-group" role="group" aria-labelledby="noiseTypeLabel">
                        <button type="button" class="option-button" data-value="white">White</button>
                        <button type="button" class="option-button" data-value="pink">Pink</button>
                        <button type="button" class="option-button" data-value="brown">Brown</button>
                    </div>
                </div>
                <div class="slider-wrapper">
                    <label for="noiseVolume">Volume</label>
                    <input type="range" id="noiseVolume" class="slider" min="-60" max="0" step="1" value="-12">
                    <output id="volumeValue" for="noiseVolume">-12 dB</output>
                </div>
                <button type="button" id="noiseToggle" aria-pressed="false">Start Noise</button>
                <p class="hint">Press <kbd>Space</kbd> to start or stop</p>
            </section>

            <!-- Filter Controls -->
            <section class="control-group">
                <h2>Filter</h2>
                <div>
                    <span class="label" id="filterTypeLabel">Filter Type</span>
                    <div id="filterType" class="button-group" role="group" aria-labelledby="filterTypeLabel">
                        <button type="button" class="option-button" data-value="lowpass">Lowpass</button>
                        <button type="button" class="option-button" data-value="highpass">Highpass</button>
                        <button type="button" class="option-button" data-value="bandpass">Bandpass</button>
                        <button type="button" class="option-button" data-value="notch">Notch</button>
                    </div>
                </div>
                <div class="slider-wrapper">
                    <label for="filterFreq">Frequency</label>
                    <input type="range" id="filterFreq" class="slider" min="0" max="1000" step="1">
                    <output id="freqValue" for="filterFreq">1000 Hz</output>
                </div>
                <div class="slider-wrapper">
                    <label for="filterQ">Resonance (Q)</label>
                    <input type="range" id="filterQ" class="slider" min="0.1" max="20" step="0.1" value="1">
                    <output id="qValue" for="filterQ">1.0</output>
                </div>
                <button type="button" id="resetSettings">Reset</button>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
